<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login">
      <h2>Web Chat</h2>
      <input id="nameInput" placeholder="输入昵称" maxlength="20" autofocus>
      <button onclick="join()">进入</button>
    </div>

    <!-- Chat -->
    <div id="chat" style="display:none">
      <div id="header">
        <span id="currentUser"></span>
        <span id="status">●</span>
      </div>
      <div id="messages"></div>
      <div id="inputBar">
        <input id="msgInput" placeholder="输入消息..." maxlength="500">
        <button onclick="send()">发送</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login">
      <div class="ascii-art"> ██╗    ██╗███████╗██████╗
 ██║    ██║██╔════╝██╔══██╗
 ██║ █╗ ██║█████╗  ██████╔╝
 ██║███╗██║██╔══╝  ██╔══██╗
 ╚███╔███╔╝███████╗██████╔╝
  ╚══╝╚══╝ ╚══════╝╚═════╝</div>
      <h2>Terminal Chat</h2>
      <div class="prompt-line">login as: </div>
      <input id="nameInput" placeholder="username" maxlength="20" autofocus>
      <input id="codeInput" placeholder="access code (if required)" maxlength="50" type="password">
      <button onclick="join()">Connect</button>
      <div id="loginError" class="error"></div>
    </div>

    <!-- Chat -->
    <div id="chat" style="display:none">
      <div id="header">
        <span id="currentUser"></span>
        <span id="onlineCount">online: 0</span>
      </div>
      <div id="messages"></div>
      <div id="inputBar">
        <span class="prompt-symbol">$</span>
        <input id="msgInput" placeholder="type a message..." maxlength="500">
        <button onclick="send()">send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>

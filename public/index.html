<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='8' width='20' height='18' rx='3' fill='%232d2d2d' stroke='%236a9955' stroke-width='2'/><rect x='10' y='13' width='4' height='4' rx='1' fill='%23569cd6'/><rect x='18' y='13' width='4' height='4' rx='1' fill='%23569cd6'/><rect x='12' y='21' width='8' height='2' rx='1' fill='%23808080'/><rect x='14' y='3' width='4' height='5' rx='1' fill='%236a9955'/><circle cx='16' cy='2' r='1.5' fill='%23dcdcaa'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Global Online Users Sidebar -->
  <div id="globalSidebar" style="display:none">
    <div class="sidebar-title">> online</div>
    <div id="globalUserList"></div>
    <div id="globalOnlineCount" class="online-count"></div>
  </div>

  <div id="app">
    <!-- Login -->
    <div id="login">
      <svg class="robot-icon" viewBox="0 0 32 32" width="48" height="48"><rect x="6" y="8" width="20" height="18" rx="3" fill="#2d2d2d" stroke="#6a9955" stroke-width="2"/><rect x="10" y="13" width="4" height="4" rx="1" fill="#569cd6"/><rect x="18" y="13" width="4" height="4" rx="1" fill="#569cd6"/><rect x="12" y="21" width="8" height="2" rx="1" fill="#808080"/><rect x="14" y="3" width="4" height="5" rx="1" fill="#6a9955"/><circle cx="16" cy="2" r="1.5" fill="#dcdcaa"/></svg>
      <div class="ascii-art"> ██╗    ██╗███████╗██████╗
 ██║    ██║██╔════╝██╔══██╗
 ██║ █╗ ██║█████╗  ██████╔╝
 ██║███╗██║██╔══╝  ██╔══██╗
 ╚███╔███╔╝███████╗██████╔╝
  ╚══╝╚══╝ ╚══════╝╚═════╝</div>
      <h2>Terminal Chat</h2>
      <div class="prompt-line">login as: </div>
      <input id="nameInput" placeholder="username" maxlength="20" autofocus>
      <input id="codeInput" placeholder="access code (if required)" maxlength="50" type="password">
      <button onclick="login()">Connect</button>
      <div id="loginError" class="error"></div>
    </div>

    <!-- Room List -->
    <div id="roomList" style="display:none">
      <div id="roomHeader">
        <span id="roomUser"></span>
        <span class="room-title">Lobby</span>
        <button id="logoutBtn" onclick="logout()">logout</button>
      </div>
      <div id="roomItems"></div>
      <div id="createRoom">
        <div class="create-label">> create room:</div>
        <div class="create-row">
          <input id="newRoomName" placeholder="room name" maxlength="30">
          <input id="newRoomPass" placeholder="password (optional)" maxlength="50" type="password">
          <button onclick="createRoom()">create</button>
        </div>
        <div id="roomError" class="error"></div>
      </div>
    </div>

    <!-- Chat -->
    <div id="chat" style="display:none">
      <div id="header">
        <span id="currentUser"></span>
        <span id="chatRoomName"></span>
        <div class="header-right">
          <div id="onlineDropdown" class="dropdown">
            <span id="onlineCount" class="dropdown-toggle">online: 0</span>
            <div id="roomUserList" class="dropdown-menu"></div>
          </div>
          <button id="leaveBtn" onclick="leaveRoom()">leave</button>
        </div>
      </div>
      <div id="chatBody">
        <div id="messages"></div>
      </div>
      <div id="inputBar">
        <span class="prompt-symbol">$</span>
        <input id="msgInput" placeholder="type a message..." maxlength="500">
        <button onclick="send()">send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
